name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -- Stage 1: Continuous Integration --
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (app.py)
        run: python -c "import ast; ast.parse(open('app.py',encoding='utf-8').read()); print('app.py: OK')"

      - name: Import check (no runtime errors)
        run: python -c "import joblib, numpy; print('Dependencies OK')"

      - name: Model bundle check
        run: |
          if [ -f agrisense_model_bundle.pkl ]; then
            SIZE=$(du -h agrisense_model_bundle.pkl | cut -f1)
            echo "Model bundle present ($SIZE)"
          else
            echo "WARNING: Model bundle missing!"
          fi

      - name: Config check
        run: |
          if [ -f .streamlit/config.toml ]; then
            echo "Streamlit config present"
          else
            echo "WARNING: .streamlit/config.toml missing!"
          fi

  # -- Stage 2: Continuous Deployment (only on push to main) --
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.AgriSense }}
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          for f in ['app.py', 'requirements.txt', '.streamlit/config.toml', 'agrisense_model_bundle.pkl']:
              api.upload_file(path_or_fileobj=f, path_in_repo=f, repo_id='SuperNitro/Agri-Sense', repo_type='space')
          print('Deployed all 4 files!')
          "
